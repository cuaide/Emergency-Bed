[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

# Azure Functions 바인딩 어노테이션은 typing.List[...] 여야 한다.
# 빌트인 list[...] 로 바꾸면 배포 후 워커가 함수를 로드하지 못한다
# (FunctionLoadError: invalid non-type annotation).
# UP006/UP035 의 자동 수정이 이 버그를 되살리지 못하게 막는다.
"function_app.py" = ["UP006", "UP035"]
"tests/test_function_app.py" = ["E501", "UP006", "UP035"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
